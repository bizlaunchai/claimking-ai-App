customHeaders:
  # The service worker must always be revalidated, otherwise an old SW can
  # linger and control returning visitors.
  - pattern: '/sw.js'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
  # App shell / HTML: never trust a stale copy. Browsers revalidate on every
  # navigation and always receive the current chunk manifest, so a fresh deploy
  # can never leave a returning visitor pointing at chunk hashes that no longer
  # exist (the "ChunkLoadError / loader stuck / no API call" failure).
  - pattern: '**/*.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
  - pattern: '/'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
  # Hash-named Next.js static assets are immutable — safe to cache forever.
  - pattern: '/_next/static/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
