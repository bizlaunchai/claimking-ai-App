customHeaders:
  - pattern: '/dashboard*'
    headers:
      - key: 'Cache-Control'
        value: 'no-store, no-cache, must-revalidate, max-age=0, s-maxage=0'
      - key: 'Pragma'
        value: 'no-cache'
      - key: 'Expires'
        value: '0'

  - pattern: '/dashboard/*'
    headers:
      - key: 'Cache-Control'
        value: 'no-store, no-cache, must-revalidate, max-age=0, s-maxage=0'
      - key: 'Pragma'
        value: 'no-cache'
      - key: 'Expires'
        value: '0'